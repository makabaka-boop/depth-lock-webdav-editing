services:
  webdav:
    build: .
    image: restricted-webdav-workspace:latest
    ports:
      - "8080:8080"
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: 8080
      DB_PATH: /data/workspace.db
      LOCK_TIMEOUT_SECONDS: "300"
    volumes:
      - webdav-data:/data
    restart: unless-stopped

volumes:
  webdav-data:
